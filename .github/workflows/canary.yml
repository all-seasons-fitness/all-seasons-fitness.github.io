name: Production canary

# The 2026-09-17 homepage takeover was live for roughly 13 hours and was found
# by a human noticing. Everything else in this repo gates what gets MERGED;
# this is the only check that looks at what is actually SERVED -- including
# breakage from a change that never went through CI at all.
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  canary:
    runs-on: ubuntu-latest
    steps:
      - name: Probe production
        id: probe
        run: |
          SITE=https://all-seasons-fitness.com
          fail=0
          note() { echo "$1" | tee -a $GITHUB_STEP_SUMMARY; }

          # Homepage must be the homepage, not some other page that claimed "/".
          title=$(curl -fsS --max-time 20 "$SITE/" | grep -o "<title>[^<]*</title>" | head -1)
          if ! echo "$title" | grep -q "All Seasons Fitness"; then
            note "FAIL homepage title is: ${title:-<none>}"
            fail=1
          else
            note "ok   homepage"
          fi

          # The stylesheet the layout hardcodes. A 404 here renders every page
          # unstyled while returning 200 everywhere else.
          code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 20 "$SITE/index.css")
          if [ "$code" != "200" ]; then
            note "FAIL /index.css returned $code"
            fail=1
          else
            note "ok   /index.css"
          fi

          for page in schedule.html coaches.html memberships.html faq.html \
                      first-class.html reviews.html workouts.html; do
            code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 20 "$SITE/$page")
            if [ "$code" != "200" ]; then
              note "FAIL /$page returned $code"
              fail=1
            else
              note "ok   /$page"
            fi
          done

          exit $fail

      # An issue, not just a red run -- a failed scheduled workflow is easy to
      # never look at. Reuses one open issue instead of filing every 15 minutes.
      - name: Open or update an issue on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const title = "Production canary failing";
            const run = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = `The production canary failed at ${new Date().toISOString()}.\n\n`
              + `Run (step summary lists which checks failed): ${run}\n\n`
              + `This checks what https://all-seasons-fitness.com is actually serving, `
              + `so a failure means the live site is wrong right now.`;

            const { data: open } = await github.rest.issues.listForRepo({
              ...context.repo, state: "open", labels: "canary",
            });

            if (open.length) {
              await github.rest.issues.createComment({
                ...context.repo, issue_number: open[0].number, body,
              });
            } else {
              await github.rest.issues.create({
                ...context.repo, title, body, labels: ["canary"],
              });
            }
