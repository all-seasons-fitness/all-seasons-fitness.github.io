name: Build

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Reads .ruby-version (3.4.1). Ruby >= 3.0 is required: github-pages 232
      # pulls nokogiri >= 1.16.2, which will not install on older Rubies.
      - uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      # JEKYLL_ENV=production matches what GitHub Pages does, so conditionals
      # in _layouts/default.html (analytics, JSON-LD) behave the same here.
      - name: Build site
        env:
          JEKYLL_ENV: production
          # jekyll-github-metadata (bundled with the github-pages gem) resolves
          # the repo via this. GitHub Pages' own builder injects it; a plain
          # Actions runner does not, so the build dies in _layouts/default.html
          # with "No repo name found".
          PAGES_REPO_NWO: ${{ github.repository }}
        run: bundle exec jekyll build

      # Assertions against _site: homepage identity, permalink hygiene, the
      # stylesheet path, page metadata, JSON-LD validity, and agreement between
      # the schedule table and its structured data. See test/site_test.rb.
      - name: Test built site
        run: bundle exec ruby test/site_test.rb

      - name: Check links and images
        run: |
          gem install html-proofer --no-document
          htmlproofer _site \
            --disable-external \
            --allow-hash-href \
            --ignore-empty-alt

      - name: Publish to staging
        id: deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: >-
            pages deploy _site
            --project-name=all-seasons-preview
            --branch=staging

      # Puts the staging link in the PR itself. Editing one comment rather than
      # adding a new one on every push keeps the thread readable.
      - name: Comment the staging link on the PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const marker = "<!-- staging-link -->";
            const body = [
              marker,
              "### Staging preview",
              "",
              "**https://staging.all-seasons-fitness.brittanyjelani.com**",
              "",
              "Sign in with Google. Shows this PR merged into `main`, and always reflects the",
              "**most recent** build across all open PRs.",
              "",
              `Built from \`${context.payload.pull_request.head.sha.slice(0, 7)}\`. ` +
              `This build also has its own permanent URL in the *Publish to staging* job log.`,
            ].join("\n");

            const { data: comments } = await github.rest.issues.listComments({
              ...context.repo, issue_number: context.issue.number,
            });
            const existing = comments.find(c => c.body.includes(marker));

            if (existing) {
              await github.rest.issues.updateComment({ ...context.repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ ...context.repo, issue_number: context.issue.number, body });
            }

  # Separate job: it needs a browser toolchain and has nothing to do with the
  # Ruby build, so keeping it apart means a slow browser install cannot delay
  # the checks that gate the merge.
  visual:
    runs-on: ubuntu-latest
    # Reported, never blocking. A real design change legitimately moves pixels;
    # this produces an artifact to look at, not a verdict.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Build site
        env:
          JEKYLL_ENV: production
          PAGES_REPO_NWO: ${{ github.repository }}
        run: bundle exec jekyll build

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install browser and deps
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium

      - name: Serve the built site
        run: |
          python3 -m http.server 4000 --directory _site &
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:4000/ >/dev/null && break
            sleep 1
          done

      - name: Screenshot and diff
        run: node test/visual/compare.mjs

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: visual-diff
          path: test/visual/output
          retention-days: 14
