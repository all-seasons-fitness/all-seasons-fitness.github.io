name: Build

on:
  pull_request:
  workflow_dispatch:

# A new push to the same PR cancels the in-flight run.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Reads .ruby-version (3.4.1). Ruby >= 3.0 is required: github-pages 232
      # pulls nokogiri >= 1.16.2, which will not install on older Rubies.
      - uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      # JEKYLL_ENV=production matches what GitHub Pages does, so conditionals
      # in _layouts/default.html (analytics, JSON-LD) behave the same here.
      - name: Build site
        env:
          JEKYLL_ENV: production
          # jekyll-github-metadata (bundled with the github-pages gem) resolves
          # the repo via this. GitHub Pages' own builder injects it; a plain
          # Actions runner does not, so the build dies in _layouts/default.html
          # with "No repo name found".
          PAGES_REPO_NWO: ${{ github.repository }}
        run: bundle exec jekyll build

      # index.md is the only page that should claim the site root. A root-level
      # .md file without front matter inherits `permalink: ""` from _config.yml,
      # collides with index.md at "/", and can silently replace the homepage --
      # which is exactly what CLAUDE.md did to the live site on 2026-09-17.
      # That failure produces a completely green build, so assert on it.
      - name: Assert homepage is the real homepage
        run: |
          if ! grep -q "All Seasons Fitness | Group Strength Classes" _site/index.html; then
            echo "::error::_site/index.html is not the real homepage. A root-level"
            echo "::error::markdown file without front matter has likely taken over '/'."
            echo "--- title found instead: ---"
            grep -o "<title>[^<]*</title>" _site/index.html || echo "(no title tag)"
            exit 1
          fi
          echo "Homepage OK"

      # Catches broken internal links and missing images — the most common way
      # a green build still ships a visibly wrong page.
      #
      # continue-on-error is deliberate: an existing site almost always has
      # pre-existing findings, and a permanently red check gets ignored. Fix the
      # backlog, then delete this line to make it blocking.
      - name: Check links and images
        continue-on-error: true
        run: |
          gem install html-proofer --no-document
          htmlproofer _site \
            --disable-external \
            --allow-hash-href \
            --ignore-empty-alt

      # Publishes the built site to the Cloudflare Pages project
      # `all-seasons-preview`, served at
      # https://staging.all-seasons-fitness.brittanyjelani.com behind Cloudflare
      # Access (Google sign-in; Drew and Brittany only).
      #
      # --branch=staging matches the project's production_branch, so the upload
      # becomes that project's current deployment and shows up at the custom
      # domain. This means the staging URL always reflects the MOST RECENT PR
      # build -- with two PRs open, the later build wins. Every deploy also gets
      # its own immutable <hash>.all-seasons-preview.pages.dev URL in the job
      # log if you need to look at one specific build.
      - name: Publish to staging
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: >-
            pages deploy _site
            --project-name=all-seasons-preview
            --branch=staging
