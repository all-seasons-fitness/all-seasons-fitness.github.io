<link rel="icon" type="image/png" sizes="32x32" href="{{ '/assets/images/favicon-32.png' | relative_url }}">
<link rel="apple-touch-icon" sizes="180x180" href="{{ '/assets/images/apple-touch-icon.png' | relative_url }}">

<!-- Open Graph tags for social sharing -->
<meta property="og:title" content="{{ page.title | default: site.title }}">
<meta property="og:description" content="{{ page.description | default: site.description }}">
<meta property="og:image" content="https://all-seasons-fitness.com/assets/images/coaches_community.webp">
<meta property="og:url" content="https://all-seasons-fitness.com{{ page.url }}">
<meta property="og:type" content="website">
<meta property="og:site_name" content="All Seasons Fitness">

<!-- Twitter Card tags -->
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="{{ page.title | default: site.title }}">
<meta name="twitter:description" content="{{ page.description | default: site.description }}">
<meta name="twitter:image" content="https://all-seasons-fitness.com/assets/images/coaches_community.webp">
